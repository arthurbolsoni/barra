[package]
name = "barra-menus"
version = "0.1.0"
edition = "2021"
description = "DLL do gancho global da barra: menus Win32 dos outros programas no modo claro ou escuro do tema"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
