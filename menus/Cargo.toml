[package]
name = "barra-menus"
version = "0.1.0"
edition = "2021"
description = "DLL dos ganchos globais da barra: menus Win32 dos outros programas no tema"

[lib]
crate-type = ["cdylib"]

[dependencies]
retour = "0.3"
windows-collections = "0.2"
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Foundation",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
