[package]
name = "barra-central"
version = "0.1.0"
edition = "2021"
description = "Serviço da central da barra: sincroniza o Google Agenda e registra o estado das sessões do Claude Code"

[[bin]]
name = "barra-central"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
ureq = "2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }
